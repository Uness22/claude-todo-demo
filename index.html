<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyFlow — AI Learning + Memorization + Active Recall System for university lectures" />
    <title>StudyFlow — Learn · Memorize · Recall · Master</title>
  </head>
  <body>
    <!-- Apply direction/theme BEFORE first paint to avoid RTL flash or wrong base direction -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('studyflow.v1') || '{}');
          var st = (s && s.settings) || {};
          var lang = st.lang || 'en';
          var root = document.documentElement;
          root.setAttribute('lang', lang === 'ar' ? 'ar' : 'en');
          root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
          root.setAttribute('data-theme', st.theme === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
